        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(135deg, sandybrown 0%, #764ba2 100%);
        font-family: Arial, Helvetica, sans-serif;
        padding: 1rem;

      .notice {

      h1 {

        margin-bottom: 1.5rem;

      .products-grid {

      .product-image {

      }
      .product-image3 img {

        object-position: center 10%;
      }
      .product-image4 img {

        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }
      .product-image5 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
      .product-image6 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 10%;
      }
      .product-image8 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
      .product-image9 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
      .product-image10 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
      .product-image11 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
      .product-image12 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }

        width: 100%;

      }
      .product-image-dynamic {
        width: 100%;
        height: 200px;
        background-color: #f0e6d2;
        border-radius: 6px;
        margin-bottom: 1rem;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .product-image-dynamic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .product-image-no-img {
        font-size: 4rem;
        color: #ccc;
      }
      .loading-products {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem;
        font-size: 1.1rem;
      }
      .product-name {
        font-size: 1.2rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 0.5rem;
      }
      .product-price {
        font-size: 1.5rem;
        color: #d9534f;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      .product-form {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.5rem;
        color: #333;
        font-size: 0.9rem;
      }
      .form-group select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        background-color: white;
        cursor: pointer;
      }
      .form-group select:focus {
        outline: none;
        border-color: sandybrown;
        box-shadow: 0 0 4px rgba(210,105,30,0.3);
      }
      /* Custom dropdown with thumbnails */
      .custom-select {
        position: relative;
        width: 100%;
      }
      .custom-select select {
        display: none;
      }
      .select-selected {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.6rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .select-selected:after {
        content: "▼";
        position: absolute;
        right: 10px;
        font-size: 0.8rem;
        color: #666;
      }
      .select-selected.select-arrow-active:after {
        content: "▲";
      }
      .select-items {
        position: absolute;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 99;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 2px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .select-hide {
        display: none;
      }
      .select-items div {
        padding: 0.6rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 1px solid #f0f0f0;
      }
      .select-items div:hover {
        background-color: #f5f5f5;
      }
      .select-items div img {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #ddd;
      }
      .select-items div .no-image {
        width: 40px;
        height: 40px;
        border: 2px dashed #ccc;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f9f9;
        font-size: 1.5rem;
        color: #999;
      }
      .select-selected img {
        width: 30px;
        height: 30px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #ddd;
      }
      .select-selected .no-image {
        width: 30px;
        height: 30px;
        border: 2px dashed #ccc;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f9f9;
        font-size: 1.2rem;
        color: #999;
      }
      button {
        padding: 0.8rem 1.5rem;
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: auto;
      }
      button:hover {
        background-color: #229954;
      }
      button:active {
        background-color: #1e8449;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 1rem;
        color: #333;

        font-weight: bold;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      footer {
        background: white;
        padding: 1rem;
        text-align: center;
        margin-top: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      footer p {
        margin: 0;
        font-size: 0.85rem;
        color: #333;
      }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
  </head>
  <body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <a href="../index.html" class="back-link">← Back to Home</a>
      <a href="cart.html" class="back-link" style="margin-bottom: 0;">🛒 View Cart <span id="cart-count" style="background: #d9534f; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem;">0</span></a>
    </div>

    <div class="notice">
      📍 All sales are LOCAL in Lawrence County, TN with local pickup only
    </div>

    <h1>Shop Our Freshies</h1>
    <!--Products loaded dynamically from Firebase-->
    <div id="products-grid" class="products-grid">
      <div class="loading-products">Loading products...</div>
    </div>

    <script>
      // Add to cart requires choosing a predefined Cardstock design for applicable products
      function addToCart(productName, price, buttonElement) {
        const form = buttonElement.closest('form');
        const scentSelect = form.querySelector('select[name="scent"]');
        const scent = scentSelect ? scentSelect.value : '';

        if (!scent) {
          alert('Please select a scent before adding to cart.');
          return;
        }

        // Try to find a cardstock select dropdown inside this form
        const cardstockSelect = form.querySelector('select[name="cardstock"]');
        let cardstockImage = null;
        if (cardstockSelect) {
          const selectedOption = cardstockSelect.options[cardstockSelect.selectedIndex];
          const imgSrc = selectedOption.dataset.img || selectedOption.getAttribute('data-img');
          const desc = selectedOption.dataset.desc || selectedOption.getAttribute('data-desc') || '';
          const id = selectedOption.value || '';
          cardstockImage = { id: id, src: imgSrc, desc: desc };
        }

        // Get existing cart from localStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const item = {
          name: productName,
          scent: scent,
          price: price,
          cardstock: {
            option: cardstockImage ? 'image' : null,
            image: cardstockImage
          }
        };

        cart.push(item);
        localStorage.setItem('cart', JSON.stringify(cart));

        updateCartCount();

        alert(`Added to cart:\n${productName} - ${scent}\n$${price.toFixed(2)}`);
      }

      function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cart-count').textContent = cart.length;
      }

      // Initialize custom dropdowns with thumbnails
      function initCustomSelects() {
        const customSelects = document.querySelectorAll('.custom-select');
        
        customSelects.forEach(customSelect => {
          const selectElement = customSelect.querySelector('select');
          if (!selectElement) return;
          
          // Create custom dropdown display
          const selectedDiv = document.createElement('div');
          selectedDiv.className = 'select-selected';
          
          // Create items container
          const itemsDiv = document.createElement('div');
          itemsDiv.className = 'select-items select-hide';
          
          // Populate with options
          Array.from(selectElement.options).forEach((option, index) => {
            const optionDiv = document.createElement('div');
            const imgSrc = option.getAttribute('data-img');
            
            if (imgSrc) {
              const img = document.createElement('img');
              img.src = imgSrc;
              img.alt = option.text;
              optionDiv.appendChild(img);
            } else {
              const noImg = document.createElement('div');
              noImg.className = 'no-image';
              noImg.innerHTML = '∅';
              optionDiv.appendChild(noImg);
            }
            
            const textSpan = document.createElement('span');
            textSpan.textContent = option.text;
            optionDiv.appendChild(textSpan);
            
            optionDiv.addEventListener('click', function(e) {
              selectElement.selectedIndex = index;
              updateSelectedDisplay(selectedDiv, option);
              closeAllSelect(selectedDiv);
              e.stopPropagation();
            });
            
            itemsDiv.appendChild(optionDiv);
          });
          
          customSelect.appendChild(selectedDiv);
          customSelect.appendChild(itemsDiv);
          
          // Set initial selection
          updateSelectedDisplay(selectedDiv, selectElement.options[0]);
          
          // Toggle dropdown on click
          selectedDiv.addEventListener('click', function(e) {
            e.stopPropagation();
            closeAllSelect(this);
            itemsDiv.classList.toggle('select-hide');
            this.classList.toggle('select-arrow-active');
          });
        });
      }
      
      function updateSelectedDisplay(selectedDiv, option) {
        selectedDiv.innerHTML = '';
        const imgSrc = option.getAttribute('data-img');
        
        if (imgSrc) {
          const img = document.createElement('img');
          img.src = imgSrc;
          img.alt = option.text;
          selectedDiv.appendChild(img);
        } else {
          const noImg = document.createElement('div');
          noImg.className = 'no-image';
          noImg.innerHTML = '∅';
          selectedDiv.appendChild(noImg);
        }
        
        const textSpan = document.createElement('span');
        textSpan.textContent = option.text;
        selectedDiv.appendChild(textSpan);
        
        // Re-add arrow indicator
        const arrow = document.createElement('span');
        selectedDiv.appendChild(arrow);
      }
      
      function closeAllSelect(elmnt) {
        const items = document.querySelectorAll('.select-items');
        const selected = document.querySelectorAll('.select-selected');
        
        items.forEach((item, index) => {
          if (elmnt !== selected[index]) {
            item.classList.add('select-hide');
            selected[index].classList.remove('select-arrow-active');
          }
        });
      }
      
      // Close dropdowns when clicking outside
      document.addEventListener('click', function() {
        closeAllSelect(null);
      });

      // ===== FIREBASE PRODUCT & SCENT LOADING =====
      const CARDSTOCK_DESIGNS = [
        { value: 'none', img: '', desc: 'None - No cardstock' },
        { value: 'design1', img: '../Resources/Images/Baby its cold CS.jpg', desc: "Christmas- Baby it's cold outside" },
        { value: 'design2', img: '../Resources/Images/Believe CS.jpg', desc: 'Christmas- Believe' },
        { value: 'design3', img: '../Resources/Images/Bra CS.jpg', desc: 'Christmas- Friends are like Bras' },
        { value: 'design4', img: '../Resources/Images/Christmas Magic CS.jpg', desc: 'Believe in the Magic of Christmas' },
        { value: 'design5', img: '../Resources/Images/Christmas Tree CS.jpg', desc: 'Christmas Tree' },
        { value: 'design6', img: '../Resources/Images/Grinchmas CS.jpg', desc: 'Grinchmas' },
        { value: 'design7', img: '../Resources/Images/Holly Jolly CS.jpg', desc: 'Holly Jolly' },
        { value: 'design8', img: '../Resources/Images/Joy to World CS.jpg', desc: 'Joy to the World' },
        { value: 'design9', img: '../Resources/Images/Santa Cam CS.jpg', desc: 'Santa Cam' },
      ];

      const DEFAULT_PRODUCTS = [
        { id: 'd1', name: 'Small Rounds', price: 7.00, imageUrl: '../Resources/Images/Small Round.jpg', hasCardstock: true, active: true },
        { id: 'd2', name: 'Behind Every Bad B**ch is a Car Seat', price: 13.00, imageUrl: '../Resources/Images/Behind every.jpg', hasCardstock: false, active: true },
        { id: 'd3', name: 'Winter Cow', price: 13.00, imageUrl: '../Resources/Images/Highland Cow.jpg', hasCardstock: false, active: true },
        { id: 'd4', name: 'Tree Cake', price: 7.00, imageUrl: '../Resources/Images/Tree Cake.jpg', hasCardstock: false, active: true },
        { id: 'd5', name: 'Coffee Cup', price: 10.00, imageUrl: '../Resources/Images/Coffee Freshie.jpg', hasCardstock: false, active: true },
        { id: 'd6', name: 'But Did You Die?', price: 10.00, imageUrl: '../Resources/Images/But Did You Die.jpg', hasCardstock: false, active: true },
        { id: 'd7', name: 'Grinch', price: 13.00, imageUrl: '../Resources/Images/Grinch.jpg', hasCardstock: false, active: true },
        { id: 'd8', name: '12 Gauge', price: 5.00, imageUrl: '../Resources/Images/12 Gauge.jpg', hasCardstock: false, active: true },
        { id: 'd9', name: 'Deer in Crosshairs', price: 15.00, imageUrl: '../Resources/Images/Deer in Crosshair.jpg', hasCardstock: false, active: true },
        { id: 'd10', name: 'Christmas Tree Jeep', price: 10.00, imageUrl: '../Resources/Images/Christmas Tree Jeep.jpg', hasCardstock: false, active: true },
        { id: 'd11', name: 'Stocking Hippo', price: 5.00, imageUrl: '../Resources/Images/Hippo Stocking.jpg', hasCardstock: false, active: true },
        { id: 'd12', name: 'Pencil', price: 5.00, imageUrl: '../Resources/Images/Pencil.jpg', hasCardstock: false, active: true },
      ];

      const DEFAULT_SCENTS = [
        'Narcissist', 'Diva', 'Vanilla Bean', 'Pumpkin Spice', 'Cinnamon Roll',
        'Black Ice', 'Snickerdoodle', 'Tis the Season', 'Peppermint Twist', 'Apple Cinnamon'
      ];

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function buildScentOptions(scents) {
        return '<option value="">Choose a scent...</option>' +
          scents.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      }

      function buildCardstockHtml(pid) {
        const options = CARDSTOCK_DESIGNS.map(d =>
          `<option value="${d.value}" data-img="${d.img}" data-desc="${escapeHtml(d.desc)}">${escapeHtml(d.desc)}</option>`
        ).join('');
        return `
          <div class="form-group">
            <label>Choose Cardstock Design:</label>
            <div class="custom-select">
              <select name="cardstock" id="cardstock-${pid}">${options}</select>
            </div>
          </div>`;
      }

      // Helper to safely get product name from data attribute for addToCart
      function addToCartDynamic(btn) {
        const name = btn.getAttribute('data-name');
        const price = parseFloat(btn.getAttribute('data-price'));
        addToCart(name, price, btn);
      }

      function renderProducts(products, scents) {
        const grid = document.getElementById('products-grid');
        const activeProducts = products.filter(p => p.active !== false);

        if (activeProducts.length === 0) {
          grid.innerHTML = '<div class="loading-products" style="color:#333;">No products available at this time. Check back soon!</div>';
          return;
        }

        const scentOptionsHtml = buildScentOptions(scents);
        let html = '';
        activeProducts.forEach((product, idx) => {
          const pid = 'dyn-' + idx;
          const imgHtml = product.imageUrl
            ? `<img src="${escapeHtml(product.imageUrl)}" alt="${escapeHtml(product.name)}">`
            : '<div class="product-image-no-img">🛍️</div>';
          const cardstockHtml = product.hasCardstock ? buildCardstockHtml(pid) : '';

          html += `
            <div class="product-card">
              <div class="product-image-dynamic">${imgHtml}</div>
              <div class="product-name">${escapeHtml(product.name)}</div>
              <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
              <form class="product-form">
                <div class="form-group">
                  <label for="scent-${pid}">Select Scent:</label>
                  <select name="scent" id="scent-${pid}">${scentOptionsHtml}</select>
                </div>
                ${cardstockHtml}
                <button type="button"
                  data-name="${escapeHtml(product.name)}"
                  data-price="${parseFloat(product.price)}"
                  onclick="addToCartDynamic(this)">Add to Cart</button>
              </form>
            </div>`;
        });

        grid.innerHTML = html;
        // Re-initialize custom dropdowns for cardstock after rendering
        initCustomSelects();
      }

      function loadProductsAndScents() {
        let products = null;
        let scents = null;

        function tryRender() {
          if (products !== null && scents !== null) {
            renderProducts(
              products.length > 0 ? products : DEFAULT_PRODUCTS,
              scents.length > 0 ? scents : DEFAULT_SCENTS
            );
          }
        }

        if (window.firebaseDB) {
          window.firebaseDB.ref('products').on('value', (snapshot) => {
            const arr = [];
            snapshot.forEach(child => arr.push({ id: child.key, ...child.val() }));
            products = arr;
            tryRender();
          });
          window.firebaseDB.ref('scents').on('value', (snapshot) => {
            const arr = [];
            snapshot.forEach(child => arr.push(child.val().name));
            scents = arr;
            tryRender();
          });
        } else {
          // Firebase unavailable, use defaults
          products = DEFAULT_PRODUCTS;
          scents = DEFAULT_SCENTS;
          tryRender();
        }
      }

      // Initialize on page load
      window.addEventListener('load', function() {
        updateCartCount();
        loadProductsAndScents();
      });
    </script>

      <p>
       &copy; 2025 Not Your Mama's Freshies. All rights reserved. | Designed by Kendal Purcell

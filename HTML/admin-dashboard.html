<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Not Your Mama's Freshies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, sandybrown 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 2rem;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.sales::before {
            background: #3498db;
        }

        .stat-card.profit::before {
            background: #27ae60;
        }

        .stat-card.items::before {
            background: #f39c12;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .stat-actions {
            margin-top: 1rem;
        }

        .clear-stats-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .clear-stats-btn:hover {
            background: #7f8c8d;
        }

        .orders-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ecf0f1;
        }

        .section-header h2 {
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .tab-buttons {
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #3498db;
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: #d5dbdb;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 1.5rem;
            background: #f8f9fa;
            transition: all 0.3s;
        }

        .order-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dee2e6;
        }

        .customer-info {
            flex: 1;
        }

        .customer-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .customer-details {
            color: #7f8c8d;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .order-total {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            text-align: right;
        }

        .order-timestamp {
            font-size: 0.85rem;
            color: #95a5a6;
            text-align: right;
        }

        .order-items {
            background: white;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .order-items h4 {
            color: #2c3e50;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
            color: #34495e;
        }

        .item-scent {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .item-price {
            font-weight: bold;
            color: #27ae60;
        }

        .special-requests {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .special-requests strong {
            color: #856404;
            display: block;
            margin-bottom: 0.5rem;
        }

        .special-requests p {
            color: #856404;
            margin: 0;
        }

        .order-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-mark-filled {
            background: #27ae60;
            color: white;
        }

        .btn-mark-filled:hover {
            background: #229954;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-restore {
            background: #3498db;
            color: white;
        }

        .btn-restore:hover {
            background: #2980b9;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #95a5a6;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-filled {
            background: #d4edda;
            color: #155724;
        }

        .design-preview {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .design-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }

        .design-preview-desc {
            font-size: 0.85rem;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tab-buttons {
                flex-direction: column;
            }

            .order-header {
                flex-direction: column;
            }

            .order-total,
            .order-timestamp {
                text-align: left;
                margin-top: 0.5rem;
            }

            .order-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <!-- Statistics Section -->
        <div class="stats-grid">
            <div class="stat-card sales">
                <div class="stat-label">Total Sales</div>
                <div class="stat-value">$<span id="total-sales">0.00</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('sales')">Clear Sales</button>
                </div>
            </div>

            <div class="stat-card profit">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value"><span id="total-orders">0</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('orders')">Clear Orders</button>
                </div>
            </div>

            <div class="stat-card items">
                <div class="stat-label">Items Sold</div>
                <div class="stat-value"><span id="items-sold">0</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('items')">Clear Items</button>
                </div>
            </div>
        </div>

        <!-- Orders Section -->
        <div class="orders-section">
            <div class="section-header">
                <h2>Order Management</h2>
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('pending')">
                        Pending Orders <span class="badge badge-pending" id="pending-count">0</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('filled')">
                        Filled Orders <span class="badge badge-filled" id="filled-count">0</span>
                    </button>
                </div>
            </div>

            <!-- Pending Orders Tab -->
            <div id="pending-orders-tab" class="orders-list">
                <!-- Orders will be dynamically inserted here -->
            </div>

            <!-- Filled Orders Tab -->
            <div id="filled-orders-tab" class="orders-list" style="display: none;">
                <!-- Filled orders will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Initialize dashboard data
        function initDashboard() {
            loadStats();
            loadOrders();
        }

        // Load statistics from localStorage
        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                totalSales: 0,
                totalOrders: 0,
                itemsSold: 0
            };

            document.getElementById('total-sales').textContent = stats.totalSales.toFixed(2);
            document.getElementById('total-orders').textContent = stats.totalOrders;
            document.getElementById('items-sold').textContent = stats.itemsSold;
        }

        // Update statistics
        function updateStats() {
            const pendingOrders = JSON.parse(localStorage.getItem('pendingOrders')) || [];
            const filledOrders = JSON.parse(localStorage.getItem('filledOrders')) || [];
            
            let totalSales = 0;
            let totalOrders = 0;
            let itemsSold = 0;

            // Calculate from filled orders only
            filledOrders.forEach(order => {
                totalSales += order.total;
                totalOrders += 1;
                itemsSold += order.items.length;
            });

            const stats = {
                totalSales,
                totalOrders,
                itemsSold
            };

            localStorage.setItem('adminStats', JSON.stringify(stats));
            loadStats();
        }

        // Clear individual stat
        function clearStat(type) {
            if (!confirm(`Are you sure you want to clear ${type}? This action cannot be undone.`)) {
                return;
            }

            const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                totalSales: 0,
                totalOrders: 0,
                itemsSold: 0
            };

            switch(type) {
                case 'sales':
                    stats.totalSales = 0;
                    break;
                case 'orders':
                    stats.totalOrders = 0;
                    break;
                case 'items':
                    stats.itemsSold = 0;
                    break;
            }

            localStorage.setItem('adminStats', JSON.stringify(stats));
            loadStats();
            alert(`${type.charAt(0).toUpperCase() + type.slice(1)} cleared successfully!`);
        }

        // Load orders from localStorage
        function loadOrders() {
            // Get inquiries from cart and convert to pending orders if not already done
            const inquiries = JSON.parse(localStorage.getItem('inquiries')) || [];
            let pendingOrders = JSON.parse(localStorage.getItem('pendingOrders')) || [];
            
            // Migrate inquiries to pending orders
            if (inquiries.length > 0) {
                inquiries.forEach(inquiry => {
                    if (!pendingOrders.find(order => order.submittedAt === inquiry.submittedAt)) {
                        pendingOrders.push({
                            ...inquiry,
                            id: Date.now() + Math.random(),
                            status: 'pending'
                        });
                    }
                });
                localStorage.setItem('pendingOrders', JSON.stringify(pendingOrders));
                // Clear inquiries after migration
                localStorage.removeItem('inquiries');
            }

            const filledOrders = JSON.parse(localStorage.getItem('filledOrders')) || [];

            displayOrders('pending', pendingOrders);
            displayOrders('filled', filledOrders);

            // Update counts
            document.getElementById('pending-count').textContent = pendingOrders.length;
            document.getElementById('filled-count').textContent = filledOrders.length;
        }

        // Display orders in the appropriate tab
        function displayOrders(type, orders) {
            const container = document.getElementById(`${type}-orders-tab`);
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <h3>No ${type} orders</h3>
                        <p>All clear! No ${type} orders at the moment.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            orders.forEach(order => {
                const date = new Date(order.submittedAt);
                const formattedDate = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let itemsHTML = '';
                order.items.forEach(item => {
                    let designHTML = '';
                    if (item.cardstock && item.cardstock.image) {
                        designHTML = `
                            <div class="design-preview">
                                <img src="${item.cardstock.image.src || ''}" alt="Design">
                                <div class="design-preview-desc">${item.cardstock.image.desc || ''}</div>
                            </div>
                        `;
                    }

                    itemsHTML += `
                        <div class="item">
                            <div>
                                <span class="item-name">${item.name}</span>
                                <span class="item-scent">- ${item.scent}</span>
                                ${designHTML}
                            </div>
                            <span class="item-price">$${item.price.toFixed(2)}</span>
                        </div>
                    `;
                });

                let specialRequestsHTML = '';
                if (order.specialRequests && order.specialRequests.trim() !== '') {
                    specialRequestsHTML = `
                        <div class="special-requests">
                            <strong>📝 Special Requests:</strong>
                            <p>${order.specialRequests}</p>
                        </div>
                    `;
                }

                const actions = type === 'pending' 
                    ? `
                        <button class="btn btn-mark-filled" onclick="markAsFilled('${order.id}')">
                            ✓ Mark as Filled
                        </button>
                        <button class="btn btn-delete" onclick="deleteOrder('${order.id}', 'pending')">
                            🗑️ Delete
                        </button>
                    `
                    : `
                        <button class="btn btn-restore" onclick="restoreOrder('${order.id}')">
                            ↩️ Restore to Pending
                        </button>
                        <button class="btn btn-delete" onclick="deleteOrder('${order.id}', 'filled')">
                            🗑️ Delete
                        </button>
                    `;

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="customer-info">
                                <div class="customer-name">
                                    ${order.firstName} ${order.lastName}
                                    <span class="badge badge-${type}">${type.toUpperCase()}</span>
                                </div>
                                <div class="customer-details">
                                    📧 ${order.email}<br>
                                    📱 ${order.phone}
                                </div>
                            </div>
                            <div>
                                <div class="order-total">$${order.total.toFixed(2)}</div>
                                <div class="order-timestamp">${formattedDate}</div>
                            </div>
                        </div>

                        <div class="order-items">
                            <h4>Order Items (${order.items.length})</h4>
                            ${itemsHTML}
                        </div>

                        ${specialRequestsHTML}

                        <div class="order-actions">
                            ${actions}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Switch between tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            if (tab === 'pending') {
                document.getElementById('pending-orders-tab').style.display = 'flex';
                document.getElementById('filled-orders-tab').style.display = 'none';
            } else {
                document.getElementById('pending-orders-tab').style.display = 'none';
                document.getElementById('filled-orders-tab').style.display = 'flex';
            }
        }

        // Mark order as filled
        function markAsFilled(orderId) {
            if (!confirm('Mark this order as filled?')) {
                return;
            }

            let pendingOrders = JSON.parse(localStorage.getItem('pendingOrders')) || [];
            let filledOrders = JSON.parse(localStorage.getItem('filledOrders')) || [];

            const orderIndex = pendingOrders.findIndex(order => order.id == orderId);
            if (orderIndex !== -1) {
                const order = pendingOrders[orderIndex];
                order.status = 'filled';
                order.filledAt = new Date().toISOString();
                
                filledOrders.push(order);
                pendingOrders.splice(orderIndex, 1);

                localStorage.setItem('pendingOrders', JSON.stringify(pendingOrders));
                localStorage.setItem('filledOrders', JSON.stringify(filledOrders));

                updateStats();
                loadOrders();
                
                alert('Order marked as filled! Statistics updated.');
            }
        }

        // Restore order to pending
        function restoreOrder(orderId) {
            if (!confirm('Restore this order to pending?')) {
                return;
            }

            let pendingOrders = JSON.parse(localStorage.getItem('pendingOrders')) || [];
            let filledOrders = JSON.parse(localStorage.getItem('filledOrders')) || [];

            const orderIndex = filledOrders.findIndex(order => order.id == orderId);
            if (orderIndex !== -1) {
                const order = filledOrders[orderIndex];
                order.status = 'pending';
                delete order.filledAt;
                
                pendingOrders.push(order);
                filledOrders.splice(orderIndex, 1);

                localStorage.setItem('pendingOrders', JSON.stringify(pendingOrders));
                localStorage.setItem('filledOrders', JSON.stringify(filledOrders));

                updateStats();
                loadOrders();
                
                alert('Order restored to pending!');
            }
        }

        // Delete order
        function deleteOrder(orderId, type) {
            if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
                return;
            }

            const storageKey = type === 'pending' ? 'pendingOrders' : 'filledOrders';
            let orders = JSON.parse(localStorage.getItem(storageKey)) || [];

            orders = orders.filter(order => order.id != orderId);
            localStorage.setItem(storageKey, JSON.stringify(orders));

            if (type === 'filled') {
                updateStats();
            }
            
            loadOrders();
            alert('Order deleted successfully!');
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'admin-login.html';
            }
        }

        // Initialize dashboard on page load
        window.addEventListener('load', () => {
            initDashboard();
            updateStats();
        });
    </script>
</body>
</html>

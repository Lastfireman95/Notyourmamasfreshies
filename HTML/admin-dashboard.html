<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Not Your Mama's Freshies</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, sandybrown 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 2rem;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.pending-orders::before {
            background: #e67e22;
        }

        .stat-card.sales::before {
            background: #3498db;
        }

        .stat-card.profit::before {
            background: #27ae60;
        }

        .stat-card.items::before {
            background: #f39c12;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .stat-actions {
            margin-top: 1rem;
        }

        .clear-stats-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .clear-stats-btn:hover {
            background: #7f8c8d;
        }

        .orders-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ecf0f1;
        }

        .section-header h2 {
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .tab-buttons {
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #3498db;
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: #d5dbdb;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 1.5rem;
            background: #f8f9fa;
            transition: all 0.3s;
        }

        .order-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dee2e6;
        }

        .customer-info {
            flex: 1;
        }

        .customer-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .customer-details {
            color: #7f8c8d;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .order-total {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            text-align: right;
        }

        .order-timestamp {
            font-size: 0.85rem;
            color: #95a5a6;
            text-align: right;
        }

        .order-items {
            background: white;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .order-items h4 {
            color: #2c3e50;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
            color: #34495e;
        }

        .item-scent {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .item-price {
            font-weight: bold;
            color: #27ae60;
        }

        .special-requests {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .special-requests strong {
            color: #856404;
            display: block;
            margin-bottom: 0.5rem;
        }

        .special-requests p {
            color: #856404;
            margin: 0;
        }

        .order-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-mark-filled {
            background: #27ae60;
            color: white;
        }

        .btn-mark-filled:hover {
            background: #229954;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-restore {
            background: #3498db;
            color: white;
        }

        .btn-restore:hover {
            background: #2980b9;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #95a5a6;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-filled {
            background: #d4edda;
            color: #155724;
        }

        .design-preview {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .design-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }

        .design-preview-desc {
            font-size: 0.85rem;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tab-buttons {
                flex-direction: column;
            }

            .order-header {
                flex-direction: column;
            }

            .order-total,
            .order-timestamp {
                text-align: left;
                margin-top: 0.5rem;
            }

            .order-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* ========== SECTION NAVIGATION ========== */
        .section-nav {
            background: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .section-nav-btn {
            background: #ecf0f1;
            color: #555;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .section-nav-btn.active { background: sandybrown; color: white; }
        .section-nav-btn:hover:not(.active) { background: #d5dbdb; }

        /* ========== PRODUCT MANAGEMENT ========== */
        .products-admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .product-admin-card {
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 1rem;
            background: #f8f9fa;
            transition: opacity 0.3s;
        }
        .product-admin-card.inactive { opacity: 0.6; }
        .product-admin-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }
        .no-img-placeholder {
            width: 100%;
            height: 140px;
            background: #ecf0f1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
        .product-admin-card h3 {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }
        .product-admin-price { font-size: 1.2rem; font-weight: bold; color: #27ae60; margin-bottom: 0.5rem; }
        .inactive-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-bottom: 0.4rem;
        }
        .product-admin-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .product-admin-actions .btn { font-size: 0.8rem; padding: 0.4rem 0.7rem; }
        .btn-add { background: #27ae60; color: white; }
        .btn-add:hover { background: #229954; }

        /* ========== MODAL ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
            overflow-y: auto;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: auto;
        }
        .modal-box h2 { margin-bottom: 1.5rem; color: #2c3e50; }
        .modal-form-group { margin-bottom: 1rem; }
        .modal-form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.4rem;
            color: #555;
            font-size: 0.9rem;
        }
        .modal-form-group input[type="text"],
        .modal-form-group input[type="number"] {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .modal-form-group input[type="text"]:focus,
        .modal-form-group input[type="number"]:focus {
            outline: none;
            border-color: sandybrown;
            box-shadow: 0 0 4px rgba(210,105,30,0.3);
        }
        .modal-form-group input[type="file"] {
            width: 100%;
            padding: 0.4rem;
            border: 1px dashed #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal !important; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        #image-preview {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 0.5rem;
            border: 1px solid #ddd;
            display: none;
        }
        .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end; }
        .btn-cancel { background: #95a5a6; color: white; }
        .btn-cancel:hover { background: #7f8c8d; }
        .btn-save { background: #27ae60; color: white; }
        .btn-save:hover { background: #229954; }

        /* ========== SCENTS ========== */
        .scents-add-form { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .scents-add-form input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .scents-add-form input:focus { outline: none; border-color: sandybrown; }
        .scents-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .scent-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #2e7d32;
            padding: 0.4rem 0.7rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .scent-tag-remove {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }
        .scent-tag-remove:hover { color: #c0392b; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <!-- Statistics Section -->
        <div class="stats-grid">
            <div class="stat-card pending-orders">
                <div class="stat-label">Pending Orders</div>
                <div class="stat-value"><span id="pending-orders-stat">0</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('pending')">Clear Pending</button>
                </div>
            </div>

            <div class="stat-card sales">
                <div class="stat-label">Total Sales</div>
                <div class="stat-value">$<span id="total-sales">0.00</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('sales')">Clear Sales</button>
                </div>
            </div>

            <div class="stat-card profit">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value"><span id="total-orders">0</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('orders')">Clear Orders</button>
                </div>
            </div>

            <div class="stat-card items">
                <div class="stat-label">Items Sold</div>
                <div class="stat-value"><span id="items-sold">0</span></div>
                <div class="stat-actions">
                    <button class="clear-stats-btn" onclick="clearStat('items')">Clear Items</button>
                </div>
            </div>
        </div>

        <!-- Section Navigation -->
        <div class="section-nav">
            <button class="section-nav-btn active" onclick="showSection('orders', this)">📦 Orders</button>
            <button class="section-nav-btn" onclick="showSection('products', this)">🛍️ Products</button>
            <button class="section-nav-btn" onclick="showSection('scents', this)">🌸 Scents</button>
        </div>

        <!-- Orders Section -->
        <div id="orders-section" class="orders-section">
            <div class="section-header">
                <h2>Order Management</h2>
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('pending')">
                        Pending Orders <span class="badge badge-pending" id="pending-count">0</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('filled')">
                        Filled Orders <span class="badge badge-filled" id="filled-count">0</span>
                    </button>
                </div>
            </div>

            <!-- Pending Orders Tab -->
            <div id="pending-orders-tab" class="orders-list">
                <!-- Orders will be dynamically inserted here -->
            </div>

            <!-- Filled Orders Tab -->
            <div id="filled-orders-tab" class="orders-list" style="display: none;">
                <!-- Filled orders will be dynamically inserted here -->
            </div>
        </div>

        <!-- Products Section -->
        <div id="products-section" class="orders-section" style="display: none;">
            <div class="section-header">
                <h2>Product Management</h2>
                <button class="btn btn-add" onclick="showAddProductModal()">+ Add Product</button>
            </div>
            <div id="products-admin-grid" class="products-admin-grid">
                <p style="grid-column: 1/-1; text-align: center; color: #95a5a6; padding: 2rem;">Loading products...</p>
            </div>
        </div>

        <!-- Scents Section -->
        <div id="scents-section" class="orders-section" style="display: none;">
            <div class="section-header">
                <h2>Scent Management</h2>
            </div>
            <div class="scents-add-form">
                <input type="text" id="new-scent-input" placeholder="Enter scent name (e.g. Vanilla Bean)">
                <button class="btn btn-add" onclick="addScent()">+ Add Scent</button>
            </div>
            <div id="scents-list" class="scents-list">
                <p style="color: #95a5a6;">Loading scents...</p>
            </div>
        </div>
    </div>

    <!-- Product Add/Edit Modal -->
    <div id="product-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="modal-box">
            <h2 id="modal-title">Add New Product</h2>
            <form id="product-form">
                <div class="modal-form-group">
                    <label for="product-name">Product Name *</label>
                    <input type="text" id="product-name" placeholder="e.g. Small Rounds" required>
                </div>
                <div class="modal-form-group">
                    <label for="product-price">Price ($) *</label>
                    <input type="number" id="product-price" min="0" step="0.01" placeholder="e.g. 7.00" required>
                </div>
                <div class="modal-form-group">
                    <label>Product Image</label>
                    <input type="file" id="product-image" accept="image/*">
                    <img id="image-preview" src="" alt="Image preview">
                </div>
                <div class="modal-form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="product-has-cardstock">
                        Show Cardstock Design Selector on Sales Page
                    </label>
                </div>
                <div class="modal-form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="product-active" checked>
                        Active (visible on Sales Page)
                    </label>
                </div>
            </form>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeProductModal()">Cancel</button>
                <button class="btn btn-save" id="save-product-btn" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
    <script>
        // ========== SECURITY: Authentication Check ==========
        // Check authentication before allowing access
        function checkAuth() {
            const adminToken = sessionStorage.getItem('adminToken');
            const tokenTimestamp = sessionStorage.getItem('adminTokenTimestamp');
            const adminUsername = sessionStorage.getItem('adminUsername');
            
            // Check if token exists and is less than 30 minutes old
            if (!adminToken || !tokenTimestamp || !adminUsername) {
                window.location.href = 'admin-login.html';
                return false;
            }
            
            const tokenAge = Date.now() - parseInt(tokenTimestamp);
            const thirtyMinutes = 30 * 60 * 1000; // 30 minutes in milliseconds
            
            if (tokenAge > thirtyMinutes) {
                sessionStorage.removeItem('adminToken');
                sessionStorage.removeItem('adminTokenTimestamp');
                sessionStorage.removeItem('adminUsername');
                alert('Session expired. Please login again.');
                window.location.href = 'admin-login.html';
                return false;
            }
            
            return true;
        }

        // Run authentication check immediately
        if (!checkAuth()) {
            document.body.innerHTML = '<div style="text-align:center;padding:3rem;color:#e74c3c;"><h2>⛔ Unauthorized Access</h2><p>Redirecting to login...</p></div>';
            throw new Error('Unauthorized access');
        }

        // ========== SECURITY: Input Sanitization ==========
        // Prevent XSS attacks by sanitizing user input
        function sanitizeHTML(input) {
            if (!input) return '';
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        // Initialize dashboard data
        function initDashboard() {
            loadStats();
            loadOrders();
        }

        // Load statistics from localStorage
        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                pendingOrders: 0,
                totalSales: 0,
                totalOrders: 0,
                itemsSold: 0
            };

            document.getElementById('pending-orders-stat').textContent = stats.pendingOrders;
            document.getElementById('total-sales').textContent = stats.totalSales.toFixed(2);
            document.getElementById('total-orders').textContent = stats.totalOrders;
            document.getElementById('items-sold').textContent = stats.itemsSold;
        }

        // Update statistics
        function updateStats() {
            // Get data from Firebase instead of localStorage
            window.firebaseDB.ref('pendingOrders').once('value', (pendingSnapshot) => {
                window.firebaseDB.ref('filledOrders').once('value', (filledSnapshot) => {
                    const pendingOrders = [];
                    const filledOrders = [];
                    
                    pendingSnapshot.forEach((childSnapshot) => {
                        pendingOrders.push(childSnapshot.val());
                    });
                    
                    filledSnapshot.forEach((childSnapshot) => {
                        filledOrders.push(childSnapshot.val());
                    });
                    
                    let totalSales = 0;
                    let totalOrders = 0;
                    let itemsSold = 0;
                    let pendingOrdersCount = pendingOrders.length;

                    // Calculate from filled orders only
                    filledOrders.forEach(order => {
                        totalSales += order.total || 0;
                        totalOrders += 1;
                        itemsSold += order.items ? order.items.length : 0;
                    });

                    const stats = {
                        pendingOrders: pendingOrdersCount,
                        totalSales,
                        totalOrders,
                        itemsSold
                    };

                    localStorage.setItem('adminStats', JSON.stringify(stats));
                    loadStats();
                });
            });
        }

        // Clear individual stat
        function clearStat(type) {
            if (type === 'pending') {
                if (!confirm('Are you sure you want to clear all pending orders? This will delete all pending orders.')) {
                    return;
                }
                // Clear pending orders from Firebase
                window.firebaseDB.ref('pendingOrders').remove()
                    .then(() => {
                        updateStats();
                        alert('All pending orders have been cleared!');
                    })
                    .catch((error) => {
                        console.error('Error clearing pending orders:', error);
                        alert('Error clearing pending orders. Please try again.');
                    });
                return;
            }

            if (!confirm(`Are you sure you want to clear ${type}? This action cannot be undone.`)) {
                return;
            }

            const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                pendingOrders: 0,
                totalSales: 0,
                totalOrders: 0,
                itemsSold: 0
            };

            switch(type) {
                case 'sales':
                    stats.totalSales = 0;
                    break;
                case 'orders':
                    stats.totalOrders = 0;
                    break;
                case 'items':
                    stats.itemsSold = 0;
                    break;
            }

            localStorage.setItem('adminStats', JSON.stringify(stats));
            loadStats();
            alert(`${type.charAt(0).toUpperCase() + type.slice(1)} cleared successfully!`);
        }

        // Load orders from Firebase
        function loadOrders() {
            // Load pending orders from Firebase
            window.firebaseDB.ref('pendingOrders').on('value', (snapshot) => {
                const pendingOrders = [];
                snapshot.forEach((childSnapshot) => {
                    pendingOrders.push(childSnapshot.val());
                });
                displayOrders('pending', pendingOrders);
                document.getElementById('pending-count').textContent = pendingOrders.length;
                
                // Update pending orders stat
                const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                    pendingOrders: 0,
                    totalSales: 0,
                    totalOrders: 0,
                    itemsSold: 0
                };
                stats.pendingOrders = pendingOrders.length;
                localStorage.setItem('adminStats', JSON.stringify(stats));
                loadStats();
            });

            // Load filled orders from Firebase
            window.firebaseDB.ref('filledOrders').on('value', (snapshot) => {
                const filledOrders = [];
                snapshot.forEach((childSnapshot) => {
                    filledOrders.push(childSnapshot.val());
                });
                displayOrders('filled', filledOrders);
                document.getElementById('filled-count').textContent = filledOrders.length;
                
                // Update stats based on filled orders
                let totalSales = 0;
                let totalOrders = 0;
                let itemsSold = 0;
                
                filledOrders.forEach(order => {
                    totalSales += order.total || 0;
                    totalOrders += 1;
                    itemsSold += order.items ? order.items.length : 0;
                });
                
                const stats = JSON.parse(localStorage.getItem('adminStats')) || {
                    pendingOrders: 0,
                    totalSales: 0,
                    totalOrders: 0,
                    itemsSold: 0
                };
                
                stats.totalSales = totalSales;
                stats.totalOrders = totalOrders;
                stats.itemsSold = itemsSold;
                
                localStorage.setItem('adminStats', JSON.stringify(stats));
                loadStats();
            });
        }

        // Display orders in the appropriate tab
        function displayOrders(type, orders) {
            const container = document.getElementById(`${type}-orders-tab`);
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <h3>No ${type} orders</h3>
                        <p>All clear! No ${type} orders at the moment.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            orders.forEach(order => {
                const date = new Date(order.submittedAt);
                const formattedDate = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let itemsHTML = '';
                order.items.forEach(item => {
                    let designHTML = '';
                    if (item.cardstock && item.cardstock.image) {
                        designHTML = `
                            <div class="design-preview">
                                <img src="${item.cardstock.image.src || ''}" alt="Design">
                                <div class="design-preview-desc">${item.cardstock.image.desc || ''}</div>
                            </div>
                        `;
                    }

                    itemsHTML += `
                        <div class="item">
                            <div>
                                <span class="item-name">${item.name}</span>
                                <span class="item-scent">- ${item.scent}</span>
                                ${designHTML}
                            </div>
                            <span class="item-price">$${item.price.toFixed(2)}</span>
                        </div>
                    `;
                });

                let specialRequestsHTML = '';
                if (order.specialRequests && order.specialRequests.trim() !== '') {
                    specialRequestsHTML = `
                        <div class="special-requests">
                            <strong>📝 Special Requests:</strong>
                            <p>${sanitizeHTML(order.specialRequests)}</p>
                        </div>
                    `;
                }

                const actions = type === 'pending' 
                    ? `
                        <button class="btn btn-mark-filled" onclick="markAsFilled('${order.id}')">
                            ✓ Mark as Filled
                        </button>
                        <button class="btn btn-delete" onclick="deleteOrder('${order.id}', 'pending')">
                            🗑️ Delete
                        </button>
                    `
                    : `
                        <button class="btn btn-restore" onclick="restoreOrder('${order.id}')">
                            ↩️ Restore to Pending
                        </button>
                        <button class="btn btn-delete" onclick="deleteOrder('${order.id}', 'filled')">
                            🗑️ Delete
                        </button>
                    `;

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="customer-info">
                                <div class="customer-name">
                                    ${sanitizeHTML(order.firstName)} ${sanitizeHTML(order.lastName)}
                                    <span class="badge badge-${type}">${type.toUpperCase()}</span>
                                </div>
                                <div class="customer-details">
                                    📧 ${sanitizeHTML(order.email)}<br>
                                    📱 ${sanitizeHTML(order.phone)}
                                </div>
                            </div>
                            <div>
                                <div class="order-total">$${order.total.toFixed(2)}</div>
                                <div class="order-timestamp">${formattedDate}</div>
                            </div>
                        </div>

                        <div class="order-items">
                            <h4>Order Items (${order.items.length})</h4>
                            ${itemsHTML}
                        </div>

                        ${specialRequestsHTML}

                        <div class="order-actions">
                            ${actions}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Switch between tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            if (tab === 'pending') {
                document.getElementById('pending-orders-tab').style.display = 'flex';
                document.getElementById('filled-orders-tab').style.display = 'none';
            } else {
                document.getElementById('pending-orders-tab').style.display = 'none';
                document.getElementById('filled-orders-tab').style.display = 'flex';
            }
        }

        // Mark order as filled
        function markAsFilled(orderId) {
            if (!confirm('Mark this order as filled?')) {
                return;
            }

            // Get order from Firebase
            window.firebaseDB.ref('pendingOrders/' + orderId).once('value', (snapshot) => {
                const order = snapshot.val();
                if (order) {
                    order.status = 'filled';
                    order.filledAt = new Date().toISOString();
                    
                    // Move to filled orders
                    window.firebaseDB.ref('filledOrders/' + orderId).set(order);
                    window.firebaseDB.ref('pendingOrders/' + orderId).remove();
                    
                    updateStats();
                    alert('Order marked as filled! Statistics updated.');
                }
            });
        }

        // Restore order to pending
        function restoreOrder(orderId) {
            if (!confirm('Restore this order to pending?')) {
                return;
            }

            // Get order from Firebase
            window.firebaseDB.ref('filledOrders/' + orderId).once('value', (snapshot) => {
                const order = snapshot.val();
                if (order) {
                    order.status = 'pending';
                    delete order.filledAt;
                    
                    // Move back to pending orders
                    window.firebaseDB.ref('pendingOrders/' + orderId).set(order);
                    window.firebaseDB.ref('filledOrders/' + orderId).remove();
                    
                    updateStats();
                    alert('Order restored to pending!');
                }
            });
        }

        // Delete order
        function deleteOrder(orderId, type) {
            if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
                return;
            }

            const dbPath = type === 'pending' ? 'pendingOrders' : 'filledOrders';
            window.firebaseDB.ref(dbPath + '/' + orderId).remove()
                .then(() => {
                    if (type === 'filled') {
                        updateStats();
                    }
                    alert('Order deleted successfully!');
                })
                .catch((error) => {
                    console.error('Error deleting order:', error);
                    alert('Error deleting order. Please try again.');
                });
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'admin-login.html';
            }
        }

        // ========== SECTION NAVIGATION ==========
        function showSection(section, btn) {
            ['orders', 'products', 'scents'].forEach(s => {
                const el = document.getElementById(s + '-section');
                if (el) el.style.display = 'none';
            });
            document.querySelectorAll('.section-nav-btn').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(section + '-section');
            if (target) target.style.display = 'block';
            if (btn) btn.classList.add('active');
        }

        // ========== PRODUCT MANAGEMENT ==========
        let editingProductId = null;

        function loadProducts() {
            window.firebaseDB.ref('products').on('value', (snapshot) => {
                const products = [];
                snapshot.forEach(child => products.push({ id: child.key, ...child.val() }));
                renderProductsAdmin(products);
            });
        }

        function renderProductsAdmin(products) {
            const container = document.getElementById('products-admin-grid');
            if (products.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#95a5a6;padding:2rem;">No products yet. Click "+ Add Product" to create your first product.</p>';
                return;
            }
            let html = '';
            products.forEach(product => {
                const isInactive = product.active === false;
                const imgHtml = product.imageUrl
                    ? `<img src="${sanitizeHTML(product.imageUrl)}" alt="${sanitizeHTML(product.name)}" onerror="this.style.display='none'">`
                    : '<div class="no-img-placeholder">🛍️</div>';
                html += `
                    <div class="product-admin-card ${isInactive ? 'inactive' : ''}">
                        ${imgHtml}
                        ${isInactive ? '<span class="inactive-badge">Hidden from Shop</span>' : ''}
                        <h3>${sanitizeHTML(product.name)}</h3>
                        <div class="product-admin-price">$${parseFloat(product.price || 0).toFixed(2)}</div>
                        <div class="product-admin-actions">
                            <button class="btn btn-restore" onclick="showEditProductModal('${product.id}')">✏️ Edit</button>
                            <button class="btn ${isInactive ? 'btn-mark-filled' : 'btn-restore'}" onclick="toggleProductActive('${product.id}', ${!isInactive})">${isInactive ? '👁️ Show' : '🙈 Hide'}</button>
                            <button class="btn btn-delete" onclick="deleteProduct('${product.id}')">🗑️ Delete</button>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function showAddProductModal() {
            editingProductId = null;
            document.getElementById('modal-title').textContent = 'Add New Product';
            document.getElementById('product-form').reset();
            document.getElementById('product-active').checked = true;
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('product-form').dataset.currentImageUrl = '';
            document.getElementById('product-modal').classList.add('open');
        }

        function showEditProductModal(productId) {
            editingProductId = productId;
            document.getElementById('modal-title').textContent = 'Edit Product';
            window.firebaseDB.ref('products/' + productId).once('value', (snapshot) => {
                const product = snapshot.val();
                if (!product) return;
                document.getElementById('product-name').value = product.name || '';
                document.getElementById('product-price').value = product.price || '';
                document.getElementById('product-has-cardstock').checked = product.hasCardstock === true;
                document.getElementById('product-active').checked = product.active !== false;
                document.getElementById('product-form').dataset.currentImageUrl = product.imageUrl || '';
                const preview = document.getElementById('image-preview');
                if (product.imageUrl) {
                    preview.src = product.imageUrl;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
                document.getElementById('product-modal').classList.add('open');
            });
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('open');
            editingProductId = null;
        }

        function handleModalOverlayClick(event) {
            if (event.target === document.getElementById('product-modal')) {
                closeProductModal();
            }
        }

        async function saveProduct() {
            const name = document.getElementById('product-name').value.trim();
            const price = parseFloat(document.getElementById('product-price').value);
            const hasCardstock = document.getElementById('product-has-cardstock').checked;
            const active = document.getElementById('product-active').checked;
            const imageFile = document.getElementById('product-image').files[0];

            if (!name) { alert('Please enter a product name.'); return; }
            if (isNaN(price) || price < 0) { alert('Please enter a valid price.'); return; }

            const saveBtn = document.getElementById('save-product-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                let imageUrl = document.getElementById('product-form').dataset.currentImageUrl || '';
                if (imageFile) {
                    imageUrl = await compressAndEncodeImage(imageFile);
                }
                const productData = { name, price, hasCardstock, active, imageUrl, updatedAt: new Date().toISOString() };
                if (editingProductId) {
                    await window.firebaseDB.ref('products/' + editingProductId).update(productData);
                    alert('Product updated successfully!');
                } else {
                    productData.createdAt = new Date().toISOString();
                    await window.firebaseDB.ref('products').push(productData);
                    alert('Product added successfully!');
                }
                closeProductModal();
            } catch (error) {
                console.error('Error saving product:', error);
                alert('Error saving product. Please try again.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Product';
            }
        }

        function compressAndEncodeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const MAX = 800;
                        if (w > MAX) { h = (h * MAX) / w; w = MAX; }
                        if (h > MAX) { w = (w * MAX) / h; h = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function toggleProductActive(productId, makeActive) {
            window.firebaseDB.ref('products/' + productId).update({ active: makeActive });
        }

        function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product? This cannot be undone.')) return;
            window.firebaseDB.ref('products/' + productId).remove()
                .then(() => alert('Product deleted successfully!'))
                .catch(err => { console.error(err); alert('Error deleting product. Please try again.'); });
        }

        // ========== SCENT MANAGEMENT ==========
        function loadScents() {
            window.firebaseDB.ref('scents').on('value', (snapshot) => {
                const scents = [];
                snapshot.forEach(child => scents.push({ id: child.key, name: child.val().name }));
                renderScents(scents);
            });
        }

        function renderScents(scents) {
            const container = document.getElementById('scents-list');
            if (scents.length === 0) {
                container.innerHTML = '<p style="color:#95a5a6;text-align:center;padding:1rem;">No scents added yet. Add your first scent above.</p>';
                return;
            }
            container.innerHTML = scents.map(s => `
                <div class="scent-tag">
                    <span>${sanitizeHTML(s.name)}</span>
                    <button class="scent-tag-remove" onclick="deleteScent('${s.id}')" title="Remove scent">✕</button>
                </div>`).join('');
        }

        function addScent() {
            const input = document.getElementById('new-scent-input');
            const name = input.value.trim();
            if (!name) { alert('Please enter a scent name.'); return; }
            window.firebaseDB.ref('scents').push({ name })
                .then(() => { input.value = ''; })
                .catch(err => { console.error(err); alert('Error adding scent. Please try again.'); });
        }

        function deleteScent(scentId) {
            if (!confirm('Remove this scent from the list?')) return;
            window.firebaseDB.ref('scents/' + scentId).remove()
                .catch(err => { console.error(err); alert('Error removing scent. Please try again.'); });
        }

        // Initialize dashboard on page load
        window.addEventListener('load', () => {
            initDashboard();
            updateStats();
            loadProducts();
            loadScents();

            // Image preview on file select
            document.getElementById('product-image').addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            });

            // Add scent on Enter key
            document.getElementById('new-scent-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); addScent(); }
            });
        });
    </script>
</body>
</html>
